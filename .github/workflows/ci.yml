name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: python {0}
    working-directory: retrolarium-kit
jobs:
  tests:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: retrolarium-kit
      - name: Read pinned Core revision
        id: core_ref
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "tools/core_pin.py"], check=True)
      - uses: actions/checkout@v4
        with:
          repository: Retrolarium/retrolarium-core
          ref: ${{ steps.core_ref.outputs.sha }}
          path: retrolarium-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "tools/test.py", "--suite", "python"], check=True)
  checks:
    name: Formatting and repository guards
    runs-on: ubuntu-latest
    env:
      STOPWORDS_LIST: ${{ secrets.RETROLARIUM_STOPWORDS }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: retrolarium-kit
      - name: Read pinned Core revision
        id: core_ref
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "tools/core_pin.py"], check=True)
      - uses: actions/checkout@v4
        with:
          repository: Retrolarium/retrolarium-core
          ref: ${{ steps.core_ref.outputs.sha }}
          path: retrolarium-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Formatters
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "-m", "pip", "install", "ruff", "mdformat", "mdformat-gfm", "shfmt-py"], check=True)
      - name: Format and guard checks
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "tools/test.py", "--suite", "checks", "--format"], check=True)
