# Retrolarium Studio views for the flicky-ue.v1 profile (Flicky).
# The kit writes these into every project it prepares from a game
# repository's descriptor; documents are relative to hack/<revision>/
# (Flicky: to its source snapshot).

[workspace]
layout = "two-row"
startup_tab = "levels"

[[workspace.tabs]]
id = "levels"
title = "Levels"
kind = "flicky.levels"
group = "content"
codec = "flicky.levels.v1"
document = "content/workspace/level/levels.json"
capabilities = ["paint", "edit", "preview", "playtest", "navigate", "undo", "restore"]
depends_on = ["graphics", "semantics", "animations"]

[[workspace.tabs]]
id = "graphics"
title = "Graphics"
kind = "flicky.graphics"
group = "assets"
codec = "flicky.graphics.v1"
document = "content/workspace/graphics/graphics.json"
capabilities = ["paint", "navigate", "undo", "restore"]
depends_on = ["semantics"]

[[workspace.tabs]]
id = "semantics"
title = "Palettes"
kind = "flicky.semantics"
group = "assets"
codec = "flicky.semantics.v1"
document = "content/workspace/graphics/semantics.json"
capabilities = ["edit", "navigate", "undo", "restore"]

[[workspace.tabs]]
id = "text"
title = "Text"
kind = "flicky.semantics"
group = "content"
document = "content/workspace/graphics/semantics.json"
codec = "flicky.semantics.v1"
capabilities = ["edit", "navigate", "undo", "restore"]

[[workspace.tabs]]
id = "animations"
title = "Animations"
kind = "flicky.animations"
group = "assets"
codec = "flicky.animations.v1"
document = "content/workspace/graphics/sequences.json"
capabilities = ["edit", "navigate", "undo", "restore"]

[[workspace.tabs]]
id = "sound"
title = "Music & Sound"
kind = "flicky.sound"
group = "content"
codec = "flicky.sound.v1"
document = "content/workspace/sound/z80_sound_data.asm"
capabilities = ["edit", "preview", "navigate", "undo", "restore"]
