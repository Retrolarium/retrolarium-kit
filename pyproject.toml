[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrolarium-kit"
version = "0.5.0"
description = "Game resource codecs, project builds and Studio services for Retrolarium"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = ["retrolarium-core"]

[project.scripts]
rltool = "retrolarium_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"retrolarium_kit.core" = [
  "opendisksys/*.json",
  "opendisksys/*.lua",
  "opendisksys/*.txt",
  "opendisksys/fds/*.bin",
  "profiles/*.json",
  "toolchains/manifest.json",
  "toolchains/licenses/*.txt",
  "toolchains/payloads/*/*/*",
  "toolchains/sources/*",
]
"retrolarium_kit.studio" = ["runtime/*.lua"]
retrolarium_kit = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
