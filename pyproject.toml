[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrolarium-kit"
version = "0.5.0"
description = "Reproducible build and reverse-engineering services for Retrolarium"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = []

[project.scripts]
rltool = "retrolarium_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retrolarium_kit = [
  "flicky_sound_preview_runtime.py",
  "firmware/opendisksys/*.json",
  "firmware/opendisksys/*.txt",
  "firmware/opendisksys/fds/*.bin",
  "ghidra_scripts/*.java",
  "profiles/*.json",
  "runtime/*.lua",
  "schemas/*.json",
  "toolchains/*.json",
  "_toolchains/manifest.json",
  "_toolchains/licenses/*.txt",
  "_toolchains/payloads/*/*/*",
  "_toolchains/sources/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
